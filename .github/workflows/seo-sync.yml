name: Sync SEO and Naver Blog

on:
  push:
    branches: [main]
    paths:
      - 'scripts/seo_sync.py'
      - '.github/workflows/seo-sync.yml'
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Naver blog and discovery files
        run: python scripts/seo_sync.py

      - name: Commit generated updates
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html columns.html column-*.html naver-blog.html robots.txt sitemap.xml llms.txt
          git commit -m "Sync Naver blog and AI search metadata"
          git push
